<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Outer Rounded Camera Body (Cream) -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="#F7F3EB" stroke="#D5CBB9" stroke-width="12"/>
  
  <!-- Top Viewfinder / Flash Hood -->
  <path d="M160 32 L190 96 L322 96 L352 32 Z" fill="#E8E0D0"/>
  
  <!-- Rainbow Accent Stripes -->
  <rect x="32" y="240" width="448" height="12" fill="#EF4444"/>
  <rect x="32" y="252" width="448" height="12" fill="#F97316"/>
  <rect x="32" y="264" width="448" height="12" fill="#EAB308"/>
  <rect x="32" y="276" width="448" height="12" fill="#22C55E"/>
  <rect x="32" y="288" width="448" height="12" fill="#3B82F6"/>

  <!-- Center Big Lens Ring -->
  <circle cx="256" cy="300" r="130" fill="#2B2724" stroke="#D5CBB9" stroke-width="14"/>
  <circle cx="256" cy="300" r="105" fill="#1A1816" stroke="#443E3A" stroke-width="6"/>
  <circle cx="256" cy="300" r="70" fill="#0284C7"/>
  <circle cx="230" cy="274" r="22" fill="#FFFFFF" opacity="0.6"/>
  
  <!-- Red Shutter Button (Top Right) -->
  <circle cx="390" cy="140" r="44" fill="#E53835" stroke="#B71C1C" stroke-width="8"/>
  <circle cx="390" cy="140" r="32" fill="#EF4444"/>
  
  <!-- Optical Viewfinder (Top Left) -->
  <rect x="88" y="104" width="72" height="72" rx="16" fill="#2B2724" stroke="#A89F8D" stroke-width="6"/>
  <circle cx="124" cy="140" r="22" fill="#38BDF8" opacity="0.8"/>
  
  <!-- Film Ejection Slot (Bottom) -->
  <rect x="128" y="440" width="256" height="16" rx="8" fill="#2B2724"/>
</svg>
